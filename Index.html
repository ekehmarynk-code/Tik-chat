<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tik Chat</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    body {
      background: #f5f5f5;
      min-height: 100vh;
    }

    .app {
      max-width: 500px;
      margin: auto;
      min-height: 100vh;
      background: white;
    }

    .header {
      background: #111;
      color: white;
      padding: 22px;
      text-align: center;
    }

    .header h1 {
      font-size: 28px;
    }

    .header p {
      margin-top: 6px;
      opacity: 0.8;
    }

    .screen {
      padding: 25px;
    }

    h2 {
      margin-bottom: 20px;
      text-align: center;
    }

    input {
      width: 100%;
      padding: 14px;
      margin-bottom: 14px;
      border: 1px solid #ccc;
      border-radius: 8px;
      font-size: 16px;
    }

    button {
      width: 100%;
      padding: 14px;
      border: none;
      border-radius: 8px;
      background: #111;
      color: white;
      font-size: 16px;
      cursor: pointer;
    }

    .switch {
      text-align: center;
      margin-top: 18px;
      color: #555;
    }

    .switch span {
      color: #111;
      font-weight: bold;
      cursor: pointer;
    }

    #chatScreen {
      display: none;
    }

    .chat-header {
      background: #111;
      color: white;
      padding: 18px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .chat-header h2 {
      margin: 0;
    }

    .logout {
      width: auto;
      padding: 8px 12px;
      background: white;
      color: #111;
      font-size: 13px;
    }

    .messages {
      height: calc(100vh - 160px);
      min-height: 400px;
      padding: 20px;
      overflow-y: auto;
      background: #eee;
    }

    .message {
      max-width: 75%;
      padding: 11px 14px;
      margin-bottom: 12px;
      border-radius: 15px;
      background: white;
      word-wrap: break-word;
    }

    .my-message {
      margin-left: auto;
      background: #111;
      color: white;
    }

    .message-box {
      display: flex;
      padding: 12px;
      background: white;
      border-top: 1px solid #ddd;
      position: sticky;
      bottom: 0;
    }

    .message-box input {
      margin: 0 8px 0 0;
      flex: 1;
    }

    .send {
      width: 75px;
      padding: 12px;
    }

    .welcome {
      text-align: center;
      margin-bottom: 25px;
      color: #555;
    }
  </style>
</head>

<body>

  <div class="app">

    <div class="header">
      <h1>💬 Tik Chat</h1>
      <p>Connect. Chat. Stay in touch.</p>
    </div>

    <!-- LOGIN / SIGN UP -->
    <div id="authScreen" class="screen">

      <h2 id="formTitle">Create Account</h2>

      <p class="welcome">
        Welcome to Tik Chat
      </p>

      <input
        type="text"
        id="name"
        placeholder="Your name"
      >

      <input
        type="email"
        id="email"
        placeholder="Email address"
      >

      <input
        type="password"
        id="password"
        placeholder="Password"
      >

      <button onclick="login()">
        Continue to Tik Chat
      </button>

      <p class="switch">
        Already have an account?
        <span onclick="showLogin()">Log in</span>
      </p>

    </div>

    <!-- CHAT SCREEN -->
    <div id="chatScreen">

      <div class="chat-header">
        <h2>Tik Chat</h2>
        <button class="logout" onclick="logout()">Logout</button>
      </div>

      <div class="messages" id="messages">

        <div class="message">
          Welcome to Tik Chat! 👋
        </div>

        <div class="message">
          Start your first conversation.
        </div>

      </div>

      <div class="message-box">

        <input
          type="text"
          id="messageInput"
          placeholder="Type a message..."
          onkeypress="handleEnter(event)"
        >

        <button class="send" onclick="sendMessage()">
          Send
        </button>

      </div>

    </div>

  </div>

  <script>

    function login() {

      const name = document.getElementById("name").value.trim();

      if (name === "") {
        alert("Please enter your name.");
        return;
      }

      localStorage.setItem("tikChatUser", name);

      document.getElementById("authScreen").style.display = "none";
      document.getElementById("chatScreen").style.display = "block";
    }


    function showLogin() {

      document.getElementById("formTitle").innerText = "Log in";

      document.querySelector(".switch").innerHTML =
        'New to Tik Chat? <span onclick="showSignup()">Create account</span>';
    }


    function showSignup() {

      document.getElementById("formTitle").innerText = "Create Account";

      document.querySelector(".switch").innerHTML =
        'Already have an account? <span onclick="showLogin()">Log in</span>';
    }


    function sendMessage() {

      const input = document.getElementById("messageInput");
      const text = input.value.trim();

      if (text === "") {
        return;
      }

      const message = document.createElement("div");

      message.className = "message my-message";
      message.innerText = text;

      document.getElementById("messages").appendChild(message);

      input.value = "";

      const messages = document.getElementById("messages");

      messages.scrollTop = messages.scrollHeight;
    }


    function handleEnter(event) {

      if (event.key === "Enter") {
        sendMessage();
      }

    }


    function logout() {

      localStorage.removeItem("tikChatUser");

      document.getElementById("chatScreen").style.display = "none";
      document.getElementById("authScreen").style.display = "block";
    }


    window.onload = function() {

      const user = localStorage.getItem("tikChatUser");

      if (user) {

        document.getElementById("authScreen").style.display = "none";
        document.getElementById("chatScreen").style.display = "block";

      }

    };

  </script>

</body>
</html>
